<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wenas</title>
  <meta name="description" content="Wenas: la red social de la gente que tenés cerca, de teléfono a teléfono, sin servidores.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wenas.app/">
  <meta property="og:title" content="Wenas · la red social de la gente que tenés cerca">
  <meta property="og:description" content="De teléfono a teléfono, sin servidores propios. Chat cifrado, llamadas, juegos y tesoros. Android e iPhone, gratis.">
  <meta property="og:image" content="https://wenas.app/marca/vista-previa.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="marca/favicon.png">
  <link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
  <style>
    :root {
      --app-bg: #e8e8e5; --surface: #fff; --surface-2: #f1f1ee; --ink: #121212; --muted: #6b6b67; --line: #d8d8d3;
      --btn-on: #121212; --btn-on-ink: #fff; --btn-line: #cfcfca; --green: #2fbf4a;
      --shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 10px -4px rgba(0,0,0,.18);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; --app-bg: #111; --surface: #1b1b1a; --surface-2: #232322; --ink: #efefec; --muted: #9a9a95; --line: #2e2e2c; --btn-on: #efefec; --btn-on-ink: #111; --btn-line: #3a3a38; }
    }
    :root[data-theme="dark"] { color-scheme: dark; --app-bg: #111; --surface: #1b1b1a; --surface-2: #232322; --ink: #efefec; --muted: #9a9a95; --line: #2e2e2c; --btn-on: #efefec; --btn-on-ink: #111; --btn-line: #3a3a38; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--app-bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
    main { width: 100%; max-width: 420px; }
    .card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 28px 22px 22px; text-align: center; min-height: 480px; display: flex; flex-direction: column; }
    .logo { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 10px; display: block; }
    h1 { font-size: 24px; margin: 6px 0 4px; font-weight: 800; }
    .sub { color: var(--muted); margin: 0 0 22px; }
    .big { font-size: 64px; line-height: 1; margin: 6px 0 14px; }
    .count { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
    h2 { font-size: 22px; margin: 6px 0 10px; font-weight: 800; }
    p.text { font-size: 17px; line-height: 1.45; margin: 0 0 6px; }
    p.note { color: var(--muted); font-size: 14px; line-height: 1.4; margin: 8px 0 0; }
    .grow { flex: 1; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: var(--btn-on); color: var(--btn-on-ink); font: 700 17px Figtree, system-ui, sans-serif; text-decoration: none; cursor: pointer; margin-top: 10px; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--btn-line); }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn.go { background: var(--green); color: #0d0d0d; }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }
    .dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 2px; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
    .dots i.on { background: var(--ink); }
    .brand { width: 22px; height: 22px; flex: none; }
    .credit { color: var(--muted); font-size: 11px; opacity: .7; margin-top: 10px; }
    .link { color: var(--muted); font-size: 14px; margin-top: 16px; }
    .shot { flex: 1; display: flex; align-items: center; justify-content: center; margin: 10px 0 4px; min-height: 0; }
    .shot img { max-width: 100%; max-height: calc(100vh - 260px); border-radius: 14px; box-shadow: var(--shadow); touch-action: pan-y; user-select: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <section class="card" id="pick">
    <img class="logo" src="marca/logo-redondo.png" alt="Wenas">
    <h1>Wenas</h1>
    <p class="sub">La gente que tenés cerca, de teléfono a teléfono, sin servidores.</p>
    <p class="text" style="margin-top:18px"><b>¿Qué teléfono tenés?</b></p>
    <div class="grow"></div>
    <button class="btn" data-path="android"><svg class="brand" viewBox="0 0 24 24" aria-hidden="true"><path fill="#3DDC84" d="M18.4395 5.5586c-.675 1.1664-1.352 2.3318-2.0274 3.498-.0366-.0155-.0742-.0286-.1113-.043-1.8249-.6957-3.484-.8-4.42-.787-1.8551.0185-3.3544.4643-4.2597.8203-.084-.1494-1.7526-3.021-2.0215-3.4864a1.1451 1.1451 0 0 0-.1406-.1914c-.3312-.364-.9054-.4859-1.379-.203-.475.282-.7136.9361-.3886 1.5019 1.9466 3.3696-.0966-.2158 1.9473 3.3593.0172.031-.4946.2642-1.3926 1.0177C2.8987 12.176.452 14.772 0 18.9902h24c-.119-1.1108-.3686-2.099-.7461-3.0683-.7438-1.9118-1.8435-3.2928-2.7402-4.1836a12.1048 12.1048 0 0 0-2.1309-1.6875c.6594-1.122 1.312-2.2559 1.9649-3.3848.2077-.3615.1886-.7956-.0079-1.1191a1.1001 1.1001 0 0 0-.8515-.5332c-.5225-.0536-.9392.3128-1.0488.5449zm-.0391 8.461c.3944.5926.324 1.3306-.1563 1.6503-.4799.3197-1.188.0985-1.582-.4941-.3944-.5927-.324-1.3307.1563-1.6504.4727-.315 1.1812-.1086 1.582.4941zM7.207 13.5273c.4803.3197.5506 1.0577.1563 1.6504-.394.5926-1.1038.8138-1.584.4941-.48-.3197-.5503-1.0577-.1563-1.6504.4008-.6021 1.1087-.8106 1.584-.4941z"/></svg>Android</button>
    <button class="btn ghost" data-path="iphone"><svg class="brand" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>iPhone o Web</button>
    <button class="btn ghost" id="preview"><svg class="brand" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>Vista previa</button>
    <a class="link" href="guia.html">Guía de uso</a>
    <p class="credit">El robot de Android es obra de Google, compartida bajo CC BY 3.0.</p>
  </section>

  <section class="card" id="step" hidden>
    <div class="count" id="count"></div>
    <div class="big" id="icon"></div>
    <h2 id="title"></h2>
    <p class="text" id="text"></p>
    <p class="note" id="note"></p>
    <div id="action"></div>
    <div class="grow"></div>
    <div class="dots" id="dots"></div>
    <div class="row">
      <button class="btn ghost" id="back">Atrás</button>
      <button class="btn" id="next">Siguiente</button>
    </div>
  </section>

  <section class="card" id="shots" hidden>
    <div class="count" id="shotCount"></div>
    <div class="shot"><img id="shot" alt="Pantalla de Wenas"></div>
    <div class="row">
      <button class="btn ghost" id="shotBack">Atrás</button>
      <button class="btn" id="shotNext">Siguiente</button>
    </div>
    <button class="btn ghost" id="shotExit">Menú principal</button>
  </section>
</main>
<script>
  const APK = 'wenas-android.apk', APK32 = 'wenas-android-32bit.apk';
  const steps = {
    android: [
      { icon: '⬇️', title: 'Descargá el archivo', text: 'Tocá el botón y esperá que baje.', note: 'Si tu teléfono es viejo, usá la versión de 32 bits.',
        action: `<a class="btn go" href="${APK}" download="${APK}" type="application/vnd.android.package-archive">Descargar Wenas</a><a class="btn ghost" href="${APK32}" download="${APK32}" type="application/vnd.android.package-archive">Versión de 32 bits</a>` },
      { icon: '📂', title: 'Abrí el archivo', text: 'Tocalo en la notificación de descarga o en la carpeta Descargas.' },
      { icon: '🔓', title: 'Permití instalarla', text: 'Si te lo pide, activá «Permitir de esta fuente» y volvé atrás.', note: 'Es porque Wenas no viene de una tienda: se pasa de mano en mano.' },
      { icon: '🛡️', title: 'Analizá la app', text: 'Play Protect te va a avisar. Tocá «Analizar app» y después «Instalar».' },
      { icon: '✅', title: 'Abrí Wenas y aceptá los permisos', text: 'Ubicación (con «Precisa» activada), notificaciones, y cámara y micrófono cuando los use.', note: 'Sin ubicación no puede mostrarte la gente que tenés cerca.' },
      { icon: '🔄', title: 'Reiniciá el teléfono', text: 'Una sola vez, después de instalar: así Google toma bien tu ubicación.' },
      { icon: '🆕', title: 'Cuando haya una versión nueva', text: 'Wenas te avisa. Volvé a wenas.app, descargá el archivo de nuevo e instalalo encima.', note: 'Tu cuenta, tus contactos y tus datos se conservan.' },
      { icon: '🎉', title: '¡Listo!', text: 'Pedile a un amigo el QR de invitación, o entrá por la puerta abierta.', action: `<a class="btn ghost" href="guia.html">Ver la guía completa</a>` },
    ],
    iphone: [
      { icon: '🧭', title: 'Abrí wenas.app en Safari', text: 'Tiene que ser Safari: en otros navegadores no se puede instalar.' },
      { icon: '▶️', title: 'Entrá a la app', text: 'Tocá el botón para abrir Wenas.', action: `<a class="btn go" href="app/">Abrir Wenas</a>` },
      { icon: '⬆️', title: 'Tocá Compartir', text: 'Es el cuadrado con una flecha hacia arriba, abajo de la pantalla.' },
      { icon: '➕', title: 'Agregar a inicio', text: 'Bajá en la lista, tocá «Agregar a pantalla de inicio» y después «Agregar».' },
      { icon: '📱', title: 'Abrila desde el ícono', text: 'Usá siempre el ícono nuevo de tu pantalla de inicio, no Safari.', note: 'Así funcionan las notificaciones.' },
      { icon: '✅', title: 'Aceptá los permisos', text: 'Ubicación («Permitir al usar la app»), notificaciones, y cámara y micrófono cuando los use.', note: 'Sin ubicación no puede mostrarte la gente que tenés cerca.' },
      { icon: '🆕', title: 'Actualizaciones', text: 'Se actualiza sola: cuando haya una versión nueva, Wenas te avisa y se recarga.' },
      { icon: '🎉', title: '¡Listo!', text: 'Pedile a un amigo el QR de invitación, o entrá por la puerta abierta.', action: `<a class="btn ghost" href="guia.html">Ver la guía completa</a>` },
    ],
  };
  let path = null, at = 0;
  const $ = (id) => document.getElementById(id);
  function show() {
    const list = steps[path], s = list[at];
    $('count').textContent = `PASO ${at + 1} DE ${list.length}`;
    $('icon').textContent = s.icon;
    $('title').textContent = s.title;
    $('text').textContent = s.text;
    $('note').textContent = s.note || '';
    $('note').hidden = !s.note;
    $('action').innerHTML = s.action || '';
    $('dots').innerHTML = list.map((_, i) => `<i class="${i === at ? 'on' : ''}"></i>`).join('');
    $('next').textContent = at === list.length - 1 ? 'Terminar' : 'Siguiente';
  }
  document.querySelectorAll('[data-path]').forEach((b) => b.addEventListener('click', () => {
    path = b.dataset.path; at = 0;
    $('pick').hidden = true; $('step').hidden = false; show();
  }));
  $('next').addEventListener('click', () => {
    if (at < steps[path].length - 1) { at++; show(); } else { $('step').hidden = true; $('pick').hidden = false; }
  });
  $('back').addEventListener('click', () => {
    if (at > 0) { at--; show(); } else { $('step').hidden = true; $('pick').hidden = false; }
  });
  // Preview: the app's screens one by one, forward and back, swipe or buttons.
  const SHOTS = 26;
  let shotAt = 0;
  const shotSrc = (i) => `vista/${String(i + 1).padStart(2, '0')}.jpg`;
  function showShot() {
    $('shot').src = shotSrc(shotAt);
    $('shotCount').textContent = `${shotAt + 1} DE ${SHOTS}`;
    $('shotBack').disabled = shotAt === 0;
    $('shotNext').textContent = shotAt === SHOTS - 1 ? 'Terminar' : 'Siguiente';
    if (shotAt + 1 < SHOTS) new Image().src = shotSrc(shotAt + 1);
  }
  function closeShots() { $('shots').hidden = true; $('pick').hidden = false; }
  $('preview').addEventListener('click', () => { shotAt = 0; $('pick').hidden = true; $('shots').hidden = false; showShot(); });
  $('shotNext').addEventListener('click', () => { if (shotAt < SHOTS - 1) { shotAt++; showShot(); } else closeShots(); });
  $('shotBack').addEventListener('click', () => { if (shotAt > 0) { shotAt--; showShot(); } });
  $('shotExit').addEventListener('click', closeShots);
  let touchX = null;
  $('shot').addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  $('shot').addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) < 40) return;
    if (dx < 0 && shotAt < SHOTS - 1) { shotAt++; showShot(); }
    if (dx > 0 && shotAt > 0) { shotAt--; showShot(); }
  });

  // An iPhone opens straight on its own path.
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) document.querySelector('[data-path="iphone"]').click();
</script>
</body>
</html>
